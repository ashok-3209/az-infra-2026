name: "Terraform CI/CD Pipeline for Azure Landing zone"

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  fmt_and_validate:
    name: "1. Format & Syntax Validation"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Check Formatting
        run: terraform fmt -check -diff -recursive

      - name: Validate Terraform Configuration (${{ matrix.environment }})
        working-directory: ./environment/${{ matrix.environment }}
        run: |
          terraform init -backend=false
          terraform validate

  terraform_plan:
    name: "2. Terraform Plan (${{ matrix.environment }})"
    needs: fmt_and_validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Initialize Terraform
        working-directory: ./environment/${{ matrix.environment }}
        run: terraform init

      - name: Run Terraform Plan
        id: plan
        working-directory: ./environment/${{ matrix.environment }}
        run: |
          terraform plan -no-color -out=tfplan

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Environment: \`${{ matrix.environment }}\`
            #### Terraform Format and Style 🖌\`success\`
            #### Terraform Initialization ⚙️\`success\`
            #### Terraform Plan 📖\`success\`

            Plan generated successfully for **${{ matrix.environment }}** environment.

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform_apply:
    name: "3. Terraform Apply (${{ matrix.environment }})"
    needs: terraform_plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Initialize Terraform
        working-directory: ./environment/${{ matrix.environment }}
        run: terraform init

      - name: Apply Terraform Configuration
        working-directory: ./environment/${{ matrix.environment }}
        run: terraform apply -auto-approve
